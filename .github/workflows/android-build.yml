name: Android Build (Release APK)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable Gradle wrapper to run
        run: chmod +x ./gradlew

      - name: Locate Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/platforms" || true

      - name: Install missing SDK packages (platform-37 + NDK)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "platform-tools" 2>&1 | tail -20

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          ls "$ANDROID_HOME/ndk" || true

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Sign unsigned release APK with fixed release keystore
        if: success()
        run: |
          set -e
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          [ -f "$APK" ] || APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNED=app/build/outputs/apk/release/app-release.apk
          cp "$APK" "$SIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks onyx_build/release.keystore \
            --ks-pass pass:onyxguard \
            --ks-key-alias onyx \
            --key-pass pass:onyxguard \
            --out "$SIGNED" "$SIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$SIGNED"
          ls -la app/build/outputs/apk/release/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error